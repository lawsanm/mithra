<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Two neighbours hand over a drill while points move the other way">
  <!-- Colours follow main.css tokens: primary #2D6CA3, accent #E9A23B, warm #EFEDE7. -->

  <!-- sky and sun -->
  <rect width="560" height="340" fill="#EFEDE7"/>
  <circle cx="462" cy="72" r="40" fill="#F8E1B6"/>
  <circle cx="462" cy="72" r="26" fill="#FCF1DC"/>

  <!-- distant hills -->
  <path d="M0 238 C90 206 170 214 250 232 C330 250 420 204 560 222 L560 340 L0 340 Z" fill="#D2E1EF"/>

  <!-- ground and lane -->
  <path d="M0 262 H560 V340 H0 Z" fill="#E3DED2"/>
  <path d="M232 340 C250 300 270 276 300 262 H338 C330 280 336 308 356 340 Z" fill="#F7F5F1"/>

  <!-- left house (lender) -->
  <rect x="50" y="152" width="132" height="110" fill="#FFFFFF"/>
  <path d="M36 158 L116 98 L196 158 Z" fill="#D08C28"/>
  <path d="M36 158 L196 158" stroke="#A66E1C" stroke-width="4" stroke-linecap="round"/>
  <rect x="62" y="178" width="28" height="24" rx="2" fill="#D2E1EF"/>
  <path d="M76 178 V202 M62 190 H90" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="104" y="204" width="32" height="58" rx="2" fill="#274B6D"/>
  <circle cx="130" cy="234" r="2" fill="#F8E1B6"/>
  <rect x="148" y="178" width="24" height="24" rx="2" fill="#D2E1EF"/>
  <ellipse cx="60" cy="262" rx="20" ry="11" fill="#2F9E44"/>
  <ellipse cx="170" cy="262" rx="16" ry="9" fill="#1E6B3E"/>

  <!-- right house (borrower) -->
  <rect x="392" y="162" width="120" height="100" fill="#FFFFFF"/>
  <path d="M378 168 L452 114 L526 168 Z" fill="#2D6CA3"/>
  <path d="M378 168 L526 168" stroke="#274B6D" stroke-width="4" stroke-linecap="round"/>
  <rect x="404" y="186" width="24" height="22" rx="2" fill="#FCF1DC"/>
  <rect x="440" y="212" width="28" height="50" rx="2" fill="#A66E1C"/>
  <circle cx="462" cy="238" r="2" fill="#FCF1DC"/>
  <rect x="480" y="186" width="22" height="22" rx="2" fill="#FCF1DC"/>
  <ellipse cx="514" cy="262" rx="18" ry="10" fill="#2F9E44"/>

  <!-- coconut palm -->
  <path d="M214 264 C220 220 222 170 232 124" stroke="#A66E1C" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M232 124 C210 110 190 116 176 132 C196 124 212 124 232 128 Z" fill="#2F9E44"/>
  <path d="M232 124 C254 106 276 108 292 122 C270 118 252 120 232 128 Z" fill="#2F9E44"/>
  <path d="M232 124 C220 98 202 90 184 92 C204 102 218 112 230 128 Z" fill="#1E6B3E"/>
  <path d="M232 124 C248 96 266 88 284 90 C266 100 250 112 234 128 Z" fill="#1E6B3E"/>
  <path d="M232 124 C232 100 240 84 252 76 C246 94 240 108 234 126 Z" fill="#2F9E44"/>
  <circle cx="228" cy="130" r="5" fill="#7A4D06"/>
  <circle cx="237" cy="131" r="5" fill="#7A4D06"/>

  <!-- points moving from borrower to lender -->
  <path d="M356 162 Q314 116 274 160" stroke="#A66E1C" stroke-width="2.5" stroke-dasharray="6 6" fill="none" stroke-linecap="round"/>
  <path d="M272 150 L274 162 L285 157" stroke="#A66E1C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="314" cy="132" r="17" fill="#E9A23B" stroke="#A66E1C" stroke-width="2.5"/>
  <circle cx="314" cy="132" r="11" fill="none" stroke="#FCF1DC" stroke-width="2"/>
  <path d="M314 125 L316.1 129.6 L321 130.2 L317.3 133.5 L318.3 138.4 L314 135.9 L309.7 138.4 L310.7 133.5 L307 130.2 L311.9 129.6 Z" fill="#FCF1DC"/>

  <!-- lender (left) -->
  <rect x="258" y="238" width="9" height="26" rx="3" fill="#274B6D"/>
  <rect x="272" y="238" width="9" height="26" rx="3" fill="#274B6D"/>
  <path d="M254 200 C254 192 260 188 269 188 C278 188 284 192 284 200 L288 244 H250 Z" fill="#2D6CA3"/>
  <circle cx="269" cy="174" r="12" fill="#8A5A3B"/>
  <path d="M257 171 C258 160 280 158 281 171 C276 166 262 166 257 171 Z" fill="#1C2733"/>
  <path d="M281 200 L302 216" stroke="#8A5A3B" stroke-width="7" stroke-linecap="round"/>

  <!-- borrower (right) -->
  <path d="M338 204 C338 196 344 192 353 192 C362 192 368 196 368 204 L370 226 H336 Z" fill="#E9A23B"/>
  <path d="M336 224 H370 L374 264 H332 Z" fill="#274B6D"/>
  <circle cx="353" cy="178" r="12" fill="#6B4430"/>
  <path d="M341 176 C340 162 366 162 365 176 C364 168 342 168 341 176 Z" fill="#1C2733"/>
  <path d="M341 204 L324 218" stroke="#6B4430" stroke-width="7" stroke-linecap="round"/>

  <!-- the drill being handed over -->
  <rect x="300" y="206" width="28" height="13" rx="4" fill="#1C2733"/>
  <rect x="306" y="216" width="9" height="18" rx="2" fill="#1C2733"/>
  <rect x="306" y="229" width="9" height="6" rx="1" fill="#E9A23B"/>
  <path d="M328 212.5 H340" stroke="#5E6A74" stroke-width="3" stroke-linecap="round"/>
</svg>
